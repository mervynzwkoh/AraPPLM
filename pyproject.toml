[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arapplm"
version = "0.1.0"
description = "Plant-Adapted Paired Protein Language Model (PPLM) for Plant Protein-Protein Interaction Prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mervyn Koh", email = "mervynzwkoh@gmail.com"}
]
dependencies = [
    "torch>=2.0.0",
    "biopython>=1.80",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "h5py>=3.8.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]
